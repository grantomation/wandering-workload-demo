---
# Diagnostic playbook to check the health and status of all Alpine services.
# Run this ON the Alpine VM itself:
#   ansible-playbook ansible_deploy/alpine/alpine_services.yml
- name: Verify all Wandering Workload services
  hosts: localhost
  connection: local

  vars:
    services_to_check:
      - name: wandering-workload
        description: "Node.js Frontend Application"
      - name: postgresql
        description: "PostgreSQL Database Backend"
      - name: wandering-env-detect
        description: "Boot-time Environment Detector (Static IP vs DHCP)"

  tasks:
    - name: Check service statuses
      ansible.builtin.command: "rc-service {{ item.name }} status"
      loop: "{{ services_to_check }}"
      register: service_checks
      changed_when: false
      failed_when: false

    - name: Get the last 5 lines of the application log
      ansible.builtin.command: tail -n 5 /var/log/wandering-workload.log
      register: app_logs
      changed_when: false
      failed_when: false

    - name: Gather system diagnostics
      ansible.builtin.command: "{{ item.cmd }}"
      loop:
        - { name: "Network IP", cmd: "ip -br a show eth0 | awk '{print $3}'" }
        - { name: "Default Route", cmd: "ip r | grep default" }
        - { name: "Root Disk Space", cmd: "df -h / | awk 'NR==2 {print $5 \" used of \" $2}'" }
        - { name: "Memory Usage", cmd: "free -h | awk '/Mem:/ {print $3 \" used out of \" $2}'" }
        - { name: "Hypervisor", cmd: "virt-what" }
      register: sys_diags
      changed_when: false
      failed_when: false

    - name: 🚀 ALPINES SERVICES SUMMARY REPORT
      ansible.builtin.debug:
        msg: |
          ====================================================================
                              WANDERING WORKLOAD HEALTH                       
          ====================================================================

          [ SERVICES ]
          {% for svc in service_checks.results %}
          {{ '- %-22s : %s' | format(svc.item.name, svc.stdout | trim if svc.stdout else svc.stderr | trim | default('Not installed')) }}
          {% endfor %}

          [ SYSTEM DIAGNOSTICS ]
          {% for diag in sys_diags.results %}
          {{ '- %-22s : %s' | format(diag.item.name, diag.stdout | trim if diag.stdout else 'No output') }}
          {% endfor %}

          [ RECENT APP LOGS ]
          {{ app_logs.stdout if app_logs.stdout | length > 0 else 'No logs found or app is not running.' }}
          ====================================================================


