---
# Builds an ALPINE golden VM image — the "different, smaller OS" experiment.
# Same SHAPE as fedora-small (download cloud image -> customize -> seal ->
# shrink) but on Alpine: ~194 MB used vs Fedora's 1.2 GB. Runs on a Linux
# KVM/libvirt build host, offline (never boots the image here). Boot-tested
# clean 2026-06-19: virtio present (virtio_net/virtio_blk), ansible-core runs,
# repo + root user only.
#
# cloud-init is disabled inside the sealed image (touch /etc/cloud/cloud-init.disabled)
# so test boots don't hang for 2 min waiting for a non-existent datasource.
# The intermediate work disk (wandering_alpine_work.qcow2) is cleaned up automatically.
#
# *** DIFFERENT OS — re-validate before stage ***
#   * Alpine = musl + busybox + OpenRC (NOT glibc/systemd). The role playbooks
#     (frontend/backend/combined) use systemd + nmcli and will NOT run as-is —
#     that rewrite is deferred. This playbook only builds the golden base.
#   * MTV raw-copy must still be proven on a clone, but virtio IS in the -virt
#     kernel, so it has a real shot.
#   * qemu-guest-agent needs the virtio-serial channel (present on OpenShift CNV,
#     not on a bare test boot) — verify post-migration.
#   * Produces the VMDK AND auto-loads a COPY into virt-manager (alpine-test) using
#     plain (non-Secure-Boot) OVMF — Alpine's grub is unsigned, so `--boot uefi`
#     (Secure Boot) gives "No bootable device". The golden itself is never booted.
#
# Usage (from the libvirt build host):
#   cd wandering-workload/ansible/golden-images/alpine
#   ansible-playbook golden.yml
#   ansible-playbook golden_alpine.yml -e alpine_rel=3.21.3   # if the URL 404s
- name: Build the Alpine golden VM image
  hosts: localhost
  connection: local

  vars:
    # --- Paths ---
    # repo_src: the wandering_workload repo root (3 dirs up from alpine/).
    # golden_base: where build artifacts land. Defaults to <repo>/build-output.
    # Override with: -e golden_base=/my/artifacts
    repo_src: "{{ (playbook_dir + '/../../..') | realpath }}"
    golden_base: "{{ repo_src }}/build-output"
    alpine_dir: "{{ golden_base }}/alpine"

    # --- Alpine "Generic Cloud" image (cloud-init + virtio, ext4 root) ---
    # VERIFY this URL if it 404s: https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/cloud/
    alpine_ver: "3.21"
    alpine_rel: "3.21.2"
    alpine_arch: "x86_64"
    alpine_image: "generic_alpine-{{ alpine_rel }}-{{ alpine_arch }}-uefi-cloudinit-r0.qcow2"
    alpine_url: "https://dl-cdn.alpinelinux.org/alpine/v{{ alpine_ver }}/releases/cloud/{{ alpine_image }}"

    # --- Images: roomy working build, then shrunk final (no VMDK in v1) ---
    alpine_work: "{{ alpine_dir }}/wandering_alpine_work.qcow2"     # 3G build disk
    golden_alpine: "{{ alpine_dir }}/wandering_alpine.qcow2"        # shrunk final

    # Working disk size: the Alpine cloud image ships a tiny root partition and,
    # built offline, cloud-init's growpart never runs — so installs overflow it.
    # We expand into this, install, then shrink to target_size.
    build_size: "3G"
    # Final geometry. Bare golden is ~194 MB; this leaves headroom to deploy
    # Node + Postgres per-clone later. resize2fs -M prints the floor if too tight.
    target_size: "640M"

    # --- Guest config ---
    guest_password: openshift
    # apk package names (ansible-core lives in the community repo, enabled below).
    guest_packages:
      - qemu-guest-agent
      - ansible-core
      - acl
      - sudo

    # --- VMDK + auto-load a test VM into virt-manager (a COPY, not the golden) ---
    output_vmdk: "{{ alpine_dir }}/wandering_alpine.vmdk"
    vmdk_subformat: monolithicSparse        # datastore-browser upload
    load_test_vm: true                      # set false to skip the virt-manager load
    test_vm: alpine-test
    test_disk: "/var/lib/libvirt/images/{{ test_vm }}.qcow2"
    # Plain OVMF — NO Secure Boot (Alpine grub is unsigned).
    ovmf_code: /usr/share/edk2/ovmf/OVMF_CODE.fd
    ovmf_vars: /usr/share/edk2/ovmf/OVMF_VARS.fd

  tasks:
    # ----- 0. Prep -----
    - name: Ensure the alpine artifacts dir exists
      ansible.builtin.file:
        path: "{{ alpine_dir }}"
        state: directory
        mode: "0755"

    - name: Check that the repo source exists
      ansible.builtin.stat:
        path: "{{ repo_src }}"
      register: repo_stat

    - name: Fail if the repo is not where we expect it
      ansible.builtin.assert:
        that: repo_stat.stat.exists and repo_stat.stat.isdir
        fail_msg: "Expected the wandering_workload repo at {{ repo_src }}."

    # ----- 1. Download the Alpine cloud image (skip if present) -----
    - name: Check whether the Alpine cloud image already exists
      ansible.builtin.stat:
        path: "{{ alpine_dir }}/{{ alpine_image }}"
      register: alpine_stat

    - name: Download the Alpine cloud image
      ansible.builtin.get_url:
        url: "{{ alpine_url }}"
        dest: "{{ alpine_dir }}/{{ alpine_image }}"
        mode: "0644"
      when: not alpine_stat.stat.exists

    # ----- 2. Expand the tiny cloud image into a roomy working disk -----
    - name: Find the base image's root (largest) partition
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.shell: >-
        set -o pipefail;
        virt-filesystems -a "{{ alpine_dir }}/{{ alpine_image }}" --partitions --long --csv
        | tail -n +2 | sort -t, -k4 -n | tail -1 | cut -d, -f1
      args:
        executable: /bin/bash
      register: base_root
      changed_when: false

    - name: Create the empty working disk ({{ build_size }})
      become: true
      ansible.builtin.command:
        argv: [qemu-img, create, -f, qcow2, "{{ alpine_work }}", "{{ build_size }}"]
      changed_when: true

    - name: Expand the Alpine root into the working disk
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv:
          - virt-resize
          - --expand
          - "{{ base_root.stdout }}"
          - "{{ alpine_dir }}/{{ alpine_image }}"
          - "{{ alpine_work }}"
      changed_when: true

    # ----- 3. Customize offline (apk + busybox + OpenRC specifics) -----
    - name: Customize the Alpine golden (packages, passwords, repo)
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv:
          - virt-customize
          - -a
          - "{{ alpine_work }}"
          - --run-command
          - "sed -i 's,^#\\(.*/community\\),\\1,' /etc/apk/repositories"
          - --install
          - "{{ guest_packages | join(',') }}"
          - --run-command
          - rc-update add qemu-guest-agent default
          - --root-password
          - "password:{{ guest_password }}"
          - --run-command
          - "sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config"
          - --copy-in
          - "{{ repo_src }}:/root/"
          - --run-command
          - rm -rf /var/cache/apk/*
      changed_when: true

    - name: Disable cloud-init (no datasource on bare boot — avoids 2 min timeout)
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv:
          - virt-customize
          - -a
          - "{{ alpine_work }}"
          - --run-command
          - touch /etc/cloud/cloud-init.disabled
      changed_when: true

    # ----- 4. Seal + sparsify the working disk -----
    - name: Seal the image (strip machine-id, SSH host keys, logs)
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv: [virt-sysprep, -a, "{{ alpine_work }}"]
      changed_when: true

    - name: Sparsify the working image
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv: [virt-sparsify, --in-place, "{{ alpine_work }}"]
      changed_when: true

    # ----- 5. Shrink the ext4 geometry back down (Alpine is tiny) -----
    # virt-resize shrinks the partition but NOT ext4, so pre-shrink the fs to its
    # minimum first (e2fsck -f required), then virt-resize re-grows it to fill.
    - name: Identify the working image's root (largest) partition
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.shell: >-
        set -o pipefail;
        virt-filesystems -a "{{ alpine_work }}" --partitions --long --csv
        | tail -n +2 | sort -t, -k4 -n | tail -1 | cut -d, -f1
      args:
        executable: /bin/bash
      register: work_root
      changed_when: false

    - name: Pre-shrink the ext4 filesystem to its minimum
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv:
          - guestfish
          - --rw
          - -a
          - "{{ alpine_work }}"
          - run
          - ":"
          - e2fsck-f
          - "{{ work_root.stdout }}"
          - ":"
          - resize2fs-M
          - "{{ work_root.stdout }}"
      changed_when: true

    - name: Create the small target disk ({{ target_size }})
      become: true
      ansible.builtin.command:
        argv: [qemu-img, create, -f, qcow2, "{{ golden_alpine }}", "{{ target_size }}"]
      changed_when: true

    - name: Shrink-copy into the small disk
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv:
          - virt-resize
          - --shrink
          - "{{ work_root.stdout }}"
          - "{{ alpine_work }}"
          - "{{ golden_alpine }}"
      changed_when: true

    - name: Sparsify the final image
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv: [virt-sparsify, --in-place, "{{ golden_alpine }}"]
      changed_when: true

    - name: Remove the intermediate working disk
      become: true
      ansible.builtin.file:
        path: "{{ alpine_work }}"
        state: absent

    # ----- 6. Convert to VMDK -----
    - name: Convert the shrunk qcow2 to VMDK ({{ vmdk_subformat }})
      become: true
      ansible.builtin.command:
        argv:
          - qemu-img
          - convert
          - -f
          - qcow2
          - -O
          - vmdk
          - -o
          - "subformat={{ vmdk_subformat }}"
          - "{{ golden_alpine }}"
          - "{{ output_vmdk }}"
      changed_when: true

    # ----- 7. Auto-load a COPY into virt-manager (never boot the golden) -----
    - name: Remove any previous test VM
      become: true
      ansible.builtin.shell: |
        virsh destroy {{ test_vm }} 2>/dev/null || true
        virsh undefine {{ test_vm }} --nvram 2>/dev/null || true
      changed_when: false
      when: load_test_vm | bool

    - name: Copy the golden to the libvirt images dir (a COPY, not the golden)
      become: true
      ansible.builtin.copy:
        src: "{{ golden_alpine }}"
        dest: "{{ test_disk }}"
        remote_src: true
        force: true
        mode: "0644"
      when: load_test_vm | bool

    - name: Define + start the test VM in virt-manager (plain OVMF, no Secure Boot)
      become: true
      ansible.builtin.command:
        argv:
          - virt-install
          - --name
          - "{{ test_vm }}"
          - --memory
          - "1024"
          - --vcpus
          - "2"
          - --disk
          - "path={{ test_disk }},bus=virtio"
          - --import
          - --os-variant
          - "detect=on,require=off"
          - --boot
          - "loader={{ ovmf_code }},loader.readonly=yes,loader.type=pflash,nvram.template={{ ovmf_vars }}"
          - --network
          - "network=default,model=virtio"
          - --graphics
          - spice
          - --noautoconsole
      changed_when: true
      when: load_test_vm | bool

    # ----- 8. Report -----
    - name: Read back the qcow size
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv: [qemu-img, info, "{{ golden_alpine }}"]
      register: alpine_info
      changed_when: false

    - name: Show the VMDK size
      ansible.builtin.command:
        argv: [ls, -lh, "{{ output_vmdk }}"]
      register: vmdk_size
      changed_when: false

    - name: Done
      ansible.builtin.debug:
        msg: >-
          Alpine golden ready: {{ golden_alpine }} | VMDK: {{ vmdk_size.stdout }}.
          {{ alpine_info.stdout_lines }}.
          {{ "Test VM '" ~ test_vm ~ "' is running in virt-manager (a copy) — open it and use
          View > Consoles > Serial 1 (login root/openshift), or 'sudo virsh console " ~ test_vm ~ "'."
          if load_test_vm | bool else "Test VM load skipped." }}
