---
# Builds the golden VM image for the Wandering Workload demo. Runs on a Linux
# KVM/libvirt build host — never boots the image, everything is offline via
# virt-customize. Using a local libvirt host avoids slow vCenter uploads during
# iteration; the final VMDK is uploaded to vSphere only when ready.
#
# Usage (from the build host):
#   cd wandering-workload/ansible/golden-images
#   ansible-playbook fedora.yml
#
# Override the defaults with -e:
#   ansible-playbook golden.yml -e fedora_ver=41 -e vmdk_subformat=streamOptimized
#
# What it does (see virt_prep.md for the full explanation):
#   1. Downloads Fedora Cloud Base if not already present
#   2. Copies it to a working image (wandering_gold.qcow2)
#   3. Injects packages (qemu-guest-agent, ansible-core), passwords, and the repo
#   4. Seals the image (virt-sysprep + virt-sparsify)
#   5. Converts to VMDK for VMware upload
#
# After this playbook finishes, upload the VMDK via the vSphere Web Client
# (see virt_prep.md section 5).
- name: Build the golden VM image
  hosts: localhost
  connection: local

  vars:
    # --- Paths (resolved to absolute — virt-customize doesn't handle '..' in paths) ---
    golden_dir: "{{ (playbook_dir + '/../..') | realpath }}"
    repo_src: "{{ (playbook_dir + '/..') | realpath }}"

    # --- Fedora Cloud Base ---
    fedora_ver: "44"
    fedora_build: "1.7"
    fedora_image: "Fedora-Cloud-Base-Generic-{{ fedora_ver }}-{{ fedora_build }}.x86_64.qcow2"
    fedora_url: "https://download.fedoraproject.org/pub/fedora/linux/releases/{{ fedora_ver }}/Cloud/x86_64/images/{{ fedora_image }}"

    # --- Output filenames ---
    working_image: "{{ golden_dir }}/wandering_gold.qcow2"
    output_vmdk: "{{ golden_dir }}/wandering_gold.vmdk"

    # --- Guest config ---
    guest_password: openshift
    guest_packages:
      - qemu-guest-agent
      - ansible-core
      - acl

    # --- VMDK subformat ---
    # monolithicSparse  = datastore browser upload (no extra tools)
    # streamOptimized   = ovftool / OVF import
    vmdk_subformat: monolithicSparse

  tasks:
    # ----- 1. Download Fedora Cloud Base (skip if already present) -----
    - name: Check whether the Fedora Cloud image already exists
      ansible.builtin.stat:
        path: "{{ golden_dir }}/{{ fedora_image }}"
      register: fedora_stat

    - name: Download Fedora Cloud Base
      ansible.builtin.get_url:
        url: "{{ fedora_url }}"
        dest: "{{ golden_dir }}/{{ fedora_image }}"
        mode: "0644"
      when: not fedora_stat.stat.exists

    # ----- 2. Create a fresh working copy -----
    - name: Copy the base image to the working image
      ansible.builtin.copy:
        src: "{{ golden_dir }}/{{ fedora_image }}"
        dest: "{{ working_image }}"
        remote_src: true
        force: true
        mode: "0644"

    # ----- 3. Customize the image offline (no boot) -----
    - name: Check that the repo source exists
      ansible.builtin.stat:
        path: "{{ repo_src }}"
      register: repo_stat

    - name: Fail if the repo is not where we expect it
      ansible.builtin.assert:
        that: repo_stat.stat.exists and repo_stat.stat.isdir
        fail_msg: >-
          Expected the wandering_workload repo at {{ repo_src }}.
          Clone it there or override with -e repo_src=/path/to/repo.

    - name: Customize the golden image (install packages, set passwords, copy repo)
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv:
          - virt-customize
          - -a
          - "{{ working_image }}"
          - --install
          - "{{ guest_packages | join(',') }}"
          - --run-command
          - systemctl enable qemu-guest-agent
          - --root-password
          - "password:{{ guest_password }}"
          - --run-command
          - useradd -m fedora
          - --password
          - "fedora:password:{{ guest_password }}"
          - --run-command
          - "echo 'fedora ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/fedora"
          - --run-command
          - "chmod 0440 /etc/sudoers.d/fedora"
          - --copy-in
          - "{{ repo_src }}:/home/fedora/"
          - --run-command
          - chown -R 1000:1000 /home/fedora/wandering_workload
          - --run-command
          - dnf clean all
      changed_when: true

    # ----- 4. Seal the image -----
    - name: Seal the image (strip machine-id, SSH host keys, logs, cloud-init state)
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv:
          - virt-sysprep
          - -a
          - "{{ working_image }}"
      changed_when: true

    - name: Sparsify the image (reclaim unused blocks)
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv:
          - virt-sparsify
          - --in-place
          - "{{ working_image }}"
      changed_when: true

    # ----- 5. Convert to VMDK -----
    - name: Convert qcow2 to VMDK ({{ vmdk_subformat }})
      become: true
      ansible.builtin.command:
        argv:
          - qemu-img
          - convert
          - -f
          - qcow2
          - -O
          - vmdk
          - -o
          - "subformat={{ vmdk_subformat }}"
          - "{{ working_image }}"
          - "{{ output_vmdk }}"
      changed_when: true

    - name: Show output location and size
      ansible.builtin.command:
        argv:
          - ls
          - -lh
          - "{{ output_vmdk }}"
      register: vmdk_size
      changed_when: false

    - name: Done
      ansible.builtin.debug:
        msg: >-
          Golden VMDK ready: {{ vmdk_size.stdout }}.
          Upload it via the vSphere Web Client datastore browser
          (see virt_prep.md section 5).
