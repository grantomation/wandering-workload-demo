---
# SMALLEST-possible golden: a fresh, minimal, EXT4 Fedora built from scratch via
# kickstart + Anaconda, then shrunk hard. Runs on a Linux KVM/libvirt build host.
# This is the "build small from the start" path — it does NOT reuse the 5 GB Cloud
# Base image, so it sidesteps the btrfs chunk-allocation floor that caps
# fedora-small.yml at ~1.7 GB.
#
# *** READ BEFORE USING ON STAGE — this is a DIFFERENT GUEST ***
#   * ext4 root, @core base, NO cloud-init, NO linux-firmware — not the F44 Cloud
#     Base guest. So the MTV raw-copy / skip-guest-conversion RE-TEST IS MANDATORY:
#     migrate one clone and confirm it boots clean and the "Convert image to
#     kubevirt" phase is absent. (virtio is in the initramfs because we install
#     onto a virtio disk, so it SHOULD raw-copy — but prove it.)
#   * It BOOTS Anaconda to install (~10–20 min, pulls packages over the network
#     from install_tree_url) — a departure from the offline, never-boot golden.
#   * Needs a reachable Fedora install TREE (not the Cloud qcow) at
#     install_tree_url.
#
# Why ext4 reaches ~1 GB where btrfs can't: virt-resize shrinks the PARTITION but
# not the filesystem (true for ext4 AND btrfs), so we pre-shrink the fs first with
# resize2fs -M (shrink-to-minimum), then virt-resize the partition (which re-grows
# the fs to fill it). Unlike btrfs, ext4 has no chunk-allocation floor, so resize2fs
# packs down to near the USED size. We install into a roomy build_size, shrink to
# minimum, then virt-resize into target_size. If target_size is too small for the
# used data, virt-resize PRINTS the minimum it needs — bump and re-run.
#
# Usage (from the libvirt build host):
#   cd wandering-workload/ansible/golden-images
#   ansible-playbook fedora-min.yml
#   ansible-playbook fedora-min.yml -e target_size=900M    # push smaller
#
# Produces wandering_min.qcow2 / wandering_min.vmdk (separate from the other
# golden outputs).
- name: Build the smallest golden (kickstart + ext4 + shrink)
  hosts: localhost
  connection: local

  vars:
    # --- Paths ---
    golden_dir: "{{ (playbook_dir + '/../..') | realpath }}"
    repo_src: "{{ (playbook_dir + '/..') | realpath }}"

    # --- Fedora install tree (the installer + repo, NOT the Cloud qcow) ---
    fedora_ver: "44"
    install_tree_url: "https://download.fedoraproject.org/pub/fedora/linux/releases/{{ fedora_ver }}/Everything/x86_64/os/"

    # --- Build VM (ephemeral; torn down after install) ---
    build_vm: ww-min-build
    # A `--location` network install fetches the ~860 MB install.img into a
    # RAM-backed initramfs (tmpfs ~= half of guest RAM). 2 GB gave only a ~680 MB
    # tmpfs -> "No space left on device" mid-download. 4 GB leaves room. The VM is
    # transient, so this RAM is only used during the build.
    build_mem: 4096
    build_size: "2G"         # roomy enough for the install transaction; shrunk later

    # --- Output images ---
    # The build disk MUST live somewhere system-libvirt's qemu (uid 107) can
    # traverse to. /home is 0700, so virt-install fails there with EACCES — keep
    # the install target in the libvirt images dir; final outputs go to golden_dir.
    ks_file: "/var/tmp/ww-min.ks"
    build_dir: /var/lib/libvirt/images
    build_image: "{{ build_dir }}/wandering_min_build.qcow2"    # raw install target
    min_image: "{{ golden_dir }}/wandering_min.qcow2"           # shrunk result
    output_vmdk: "{{ golden_dir }}/wandering_min.vmdk"

    # --- Shrink target (disk geometry). ext4 shrinks cleanly; if too small,
    #     virt-resize prints the floor. Start at 1G and push down with -e. ---
    target_size: "1G"

    # --- Guest config ---
    guest_password: openshift

    # --- VMDK subformat (datastore-browser upload) ---
    vmdk_subformat: monolithicSparse

  tasks:
    # ----- 0. Preflight -----
    - name: Check that the repo source exists
      ansible.builtin.stat:
        path: "{{ repo_src }}"
      register: repo_stat

    - name: Fail if the repo is not where we expect it
      ansible.builtin.assert:
        that: repo_stat.stat.exists and repo_stat.stat.isdir
        fail_msg: >-
          Expected the wandering_workload repo at {{ repo_src }}.
          Clone it there or override with -e repo_src=/path/to/repo.

    - name: Remove any leftover build VM + disk from a previous run
      become: true
      ansible.builtin.shell: |
        virsh destroy {{ build_vm }} 2>/dev/null || true
        virsh undefine {{ build_vm }} --nvram 2>/dev/null || true
        rm -f {{ build_image }}
      changed_when: false
      failed_when: false

    # ----- 1. Write the kickstart -----
    # Minimal ext4 layout: GPT, ESP + ext4 root only (no swap, no separate /boot,
    # no LVM) = smallest and easiest to shrink. Drops linux-firmware (~hundreds of
    # MB, useless on a virtio VM) and plymouth. Anaconda relabels SELinux itself.
    - name: Write the kickstart file
      become: true
      ansible.builtin.copy:
        dest: "{{ ks_file }}"
        mode: "0644"
        content: |
          text
          firstboot --disable
          selinux --enforcing
          timezone UTC --utc
          keyboard us
          lang en_US.UTF-8
          network --bootproto=dhcp --device=link --activate
          rootpw --plaintext {{ guest_password }}
          user --name=fedora --groups=wheel --plaintext --password={{ guest_password }}
          services --enabled=qemu-guest-agent
          zerombr
          clearpart --all --initlabel --disklabel=gpt
          part /boot/efi --fstype=efi --size=100
          part /         --fstype=ext4 --size=1024 --grow
          bootloader --timeout=1 --append="console=ttyS0,115200 console=tty0"
          poweroff

          %packages --excludedocs --inst-langs=en
          @core
          qemu-guest-agent
          ansible-core
          acl
          -linux-firmware
          -plymouth
          %end

          %post --erroronfail
          echo 'fedora ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/fedora
          chmod 0440 /etc/sudoers.d/fedora
          systemctl enable qemu-guest-agent
          dnf clean all
          %end

    # ----- 2. Build via Anaconda (boots, installs, powers off) -----
    - name: Create the empty build disk ({{ build_size }})
      become: true
      ansible.builtin.command:
        argv:
          - qemu-img
          - create
          - -f
          - qcow2
          - "{{ build_image }}"
          - "{{ build_size }}"
      changed_when: true

    - name: Run the kickstart install (headless, waits for poweroff)
      become: true
      ansible.builtin.command:
        argv:
          - virt-install
          - --name
          - "{{ build_vm }}"
          - --memory
          - "{{ build_mem }}"
          - --vcpus
          - "2"
          - --disk
          - "path={{ build_image }},bus=virtio,format=qcow2"
          - --location
          - "{{ install_tree_url }}"
          - --initrd-inject
          - "{{ ks_file }}"
          - --extra-args
          - "inst.ks=file:/{{ ks_file | basename }} console=ttyS0,115200 inst.text"
          - --os-variant
          - fedora-unknown
          - --boot
          - uefi
          - --graphics
          - none
          - --noautoconsole
      changed_when: true

    # virt-install --noautoconsole returns as soon as the install STARTS, so we
    # must wait for the kickstart `poweroff` ourselves. (Don't rely on --wait;
    # virt-install 5.1.0 returns early and the disk stays lock-held mid-install.)
    - name: Wait for the kickstart install to finish (VM powers off)
      become: true
      ansible.builtin.command: virsh domstate {{ build_vm }}
      register: dom_state
      until: dom_state.stdout.strip() == "shut off"
      retries: 120
      delay: 20
      changed_when: false

    - name: Tear down the build VM definition (disk is kept)
      become: true
      ansible.builtin.command: virsh undefine {{ build_vm }} --nvram
      changed_when: true
      failed_when: false

    # The VM powers off whether the install SUCCEEDED or CRASHED, so confirm it
    # actually produced a filesystem before we try to customize an empty disk.
    - name: Inspect the built image for a root filesystem
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command: virt-filesystems --filesystems -a {{ build_image }}
      register: built_fs
      changed_when: false
      failed_when: false

    - name: Fail clearly if the install did not complete
      ansible.builtin.assert:
        that: built_fs.rc == 0 and (built_fs.stdout | trim | length > 0)
        fail_msg: >-
          The kickstart install left no filesystem on {{ build_image }} - Anaconda
          crashed (commonly OOM fetching install.img into the initramfs). Check the
          install console, then bump build_mem (currently {{ build_mem }} MB) or use
          a faster install_tree_url, and re-run.

    # ----- 3. Copy the repo in (offline, like golden.yml) + seal -----
    - name: Copy the repo into the image
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv:
          - virt-customize
          - -a
          - "{{ build_image }}"
          - --copy-in
          - "{{ repo_src }}:/home/fedora/"
          - --run-command
          - chown -R 1000:1000 /home/fedora/wandering_workload
      changed_when: true

    - name: Seal the image (strip machine-id, SSH host keys, logs)
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv:
          - virt-sysprep
          - -a
          - "{{ build_image }}"
      changed_when: true

    # ----- 4. Shrink the geometry (ext4 — virt-resize shrinks the fs cleanly) -----
    - name: Show disk layout
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv:
          - virt-filesystems
          - --long
          - --parts
          - --filesystems
          - -h
          - -a
          - "{{ build_image }}"
      register: fs_layout
      changed_when: false

    - name: Print the layout
      ansible.builtin.debug:
        var: fs_layout.stdout_lines

    - name: Identify the largest (root) partition
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.shell: >-
        set -o pipefail;
        virt-filesystems -a "{{ build_image }}" --partitions --long --csv
        | tail -n +2 | sort -t, -k4 -n | tail -1 | cut -d, -f1
      args:
        executable: /bin/bash
      register: root_part
      changed_when: false

    # virt-resize shrinks the partition but NOT the ext4 inside it, so shrink the
    # filesystem to its minimum first (e2fsck -f is required before resize2fs).
    # virt-resize then re-grows it to fill the smaller partition.
    - name: Pre-shrink the ext4 filesystem to its minimum
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv:
          - guestfish
          - --rw
          - -a
          - "{{ build_image }}"
          - run
          - ":"
          - e2fsck-f
          - "{{ root_part.stdout }}"
          - ":"
          - resize2fs-M
          - "{{ root_part.stdout }}"
      changed_when: true

    - name: Create the small target disk ({{ target_size }})
      become: true
      ansible.builtin.command:
        argv:
          - qemu-img
          - create
          - -f
          - qcow2
          - "{{ min_image }}"
          - "{{ target_size }}"
      changed_when: true

    - name: Shrink-copy into the small disk (ext4 fs + partition)
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv:
          - virt-resize
          - --shrink
          - "{{ root_part.stdout }}"
          - "{{ build_image }}"
          - "{{ min_image }}"
      changed_when: true

    - name: Sparsify the small image
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv:
          - virt-sparsify
          - --in-place
          - "{{ min_image }}"
      changed_when: true

    # ----- 5. Convert to VMDK -----
    - name: Convert the shrunk qcow2 to VMDK ({{ vmdk_subformat }})
      become: true
      ansible.builtin.command:
        argv:
          - qemu-img
          - convert
          - -f
          - qcow2
          - -O
          - vmdk
          - -o
          - "subformat={{ vmdk_subformat }}"
          - "{{ min_image }}"
          - "{{ output_vmdk }}"
      changed_when: true

    # ----- 6. Report -----
    - name: Read back the shrunk qcow virtual size
      become: true
      ansible.builtin.command:
        argv:
          - qemu-img
          - info
          - "{{ min_image }}"
      register: min_info
      changed_when: false

    - name: Show the VMDK file size
      ansible.builtin.command:
        argv: [ls, -lh, "{{ output_vmdk }}"]
      register: vmdk_size
      changed_when: false

    - name: Done
      ansible.builtin.debug:
        msg: >-
          Minimal image ready. qcow info: {{ min_info.stdout_lines }} |
          VMDK: {{ vmdk_size.stdout }}. BEFORE stage: migrate one clone with
          skip-guest-conversion and confirm it boots clean + no convert-to-kubevirt
          phase. The intermediate {{ build_image }} can be deleted once happy.
