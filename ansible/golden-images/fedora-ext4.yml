---
# Converts the btrfs Cloud Base golden (wandering_gold.qcow2) to EXT4 to reach
# ~1 GB. Keeps the EXACT proven F44 guest — same packages, same kernel — only the
# filesystem changes, so resize2fs can pack the ~700 MB down to a ~1 GB disk where
# btrfs's chunk-allocation floor capped golden_small at 1.7 GB.
#
# *** READ BEFORE STAGE ***
#   * Different filesystem => MTV raw-copy / skip-guest-conversion RE-TEST IS
#     MANDATORY. (Smaller delta than golden_min — only the FS changed, not the
#     package set or init — but still prove it on one clone.)
#   * The result is made bootable by reinstalling grub, regenerating the
#     initramfs, rewriting fstab and forcing a SELinux relabel — IN A CHROOT.
#     This is the fiddly part; expect to iterate.
#   * grub is installed with --removable (writes EFI/BOOT/BOOTX64.EFI) so it boots
#     on the default UEFI path regardless of NVRAM. If you need Secure Boot, that
#     path uses grub directly (no shim) — verify on your target.
#
# Requires on the build host: qemu-nbd + nbd module, sgdisk (gdisk), guestmount,
# rsync, mkfs.ext4, mkfs.vfat. The preflight checks for these.
#
# Usage (from the libvirt build host):
#   cd wandering-workload/ansible/golden-images
#   ansible-playbook fedora-ext4.yml                         # source = wandering_gold.qcow2
#   ansible-playbook golden_ext4.yml -e target_size=1100M    # if 1G is too tight
#
# Source must already exist (build it with golden.yml first). Produces
# wandering_ext4.qcow2 / wandering_ext4.vmdk.
- name: Convert the golden from btrfs to ext4 (smallest)
  hosts: localhost
  connection: local

  vars:
    golden_dir: "{{ (playbook_dir + '/../..') | realpath }}"

    source_image: "{{ golden_dir }}/wandering_gold.qcow2"   # btrfs Cloud Base golden
    ext4_image: "{{ golden_dir }}/wandering_ext4.qcow2"
    output_vmdk: "{{ golden_dir }}/wandering_ext4.vmdk"
    convert_script: /var/tmp/ww-btrfs2ext4.sh

    # Final disk geometry. ext4 packs near the used data; if too tight virt-... no
    # virt-resize here — the ext4 is mkfs'd straight into this disk, so it must
    # hold the data. ~700 MB bare golden fits 1G; bump for deployment headroom.
    target_size: "1G"

    vmdk_subformat: monolithicSparse

  tasks:
    # ----- 0. Preflight -----
    - name: Check the source golden exists
      ansible.builtin.stat:
        path: "{{ source_image }}"
      register: src_stat

    - name: Fail if the source golden is missing
      ansible.builtin.assert:
        that: src_stat.stat.exists
        fail_msg: >-
          Source {{ source_image }} not found. Build the btrfs golden first
          (golden.yml), or pass -e source_image=/path/to/golden.qcow2.

    - name: Check required tools are present
      ansible.builtin.command: "which {{ item }}"
      register: tool_check
      changed_when: false
      failed_when: tool_check.rc != 0
      loop:
        - qemu-nbd
        - sgdisk
        - guestmount
        - rsync
        - mkfs.ext4
        - mkfs.vfat

    # ----- 1. Drop the conversion script -----
    - name: Write the btrfs->ext4 conversion script
      ansible.builtin.copy:
        dest: "{{ convert_script }}"
        mode: "0755"
        content: |
          #!/bin/bash
          # btrfs Cloud Base golden -> ext4, keeping the proven guest. Makes the
          # copy bootable via chroot (grub + dracut + fstab + relabel).
          set -euo pipefail
          SRC="$1"; DST="$2"; SIZE="$3"
          export LIBGUESTFS_BACKEND=direct
          SRCMNT="$(mktemp -d)"; DSTMNT="$(mktemp -d)"
          NBD=/dev/nbd0

          cleanup() {
            set +e
            for m in dev/pts dev proc sys run boot/efi ""; do
              mountpoint -q "$DSTMNT/$m" && umount -R "$DSTMNT/$m"
            done
            mountpoint -q "$SRCMNT" && guestunmount "$SRCMNT"
            qemu-nbd --disconnect "$NBD" >/dev/null 2>&1
            rmdir "$SRCMNT" "$DSTMNT" 2>/dev/null
          }
          trap cleanup EXIT

          # Root device = largest partition; reuse its UUID for the new ext4 so the
          # ESP grub stub + fstab UUID still match (only fstype/options change).
          ROOTDEV="$(virt-filesystems -a "$SRC" --partitions --long --csv \
            | tail -n +2 | sort -t, -k4 -n | tail -1 | cut -d, -f1)"
          OLDUUID="$(guestfish --ro -a "$SRC" run : vfs-uuid "$ROOTDEV")"
          echo "source root=$ROOTDEV uuid=$OLDUUID"

          # Fresh target disk: GPT, ESP(100M) + ext4 root(rest)
          modprobe nbd max_part=8
          rm -f "$DST"
          qemu-img create -f qcow2 "$DST" "$SIZE" >/dev/null
          qemu-nbd --connect="$NBD" "$DST"
          udevadm settle 2>/dev/null || sleep 1
          sgdisk -Z "$NBD" >/dev/null
          sgdisk -n1:0:+100M -t1:EF00 -c1:EFI  "$NBD" >/dev/null
          sgdisk -n2:0:0     -t2:8300 -c2:root "$NBD" >/dev/null
          partprobe "$NBD"; udevadm settle 2>/dev/null || sleep 1
          mkfs.vfat -F32 "${NBD}p1" >/dev/null
          mkfs.ext4 -F -U "$OLDUUID" "${NBD}p2" >/dev/null
          ESPUUID="$(blkid -s UUID -o value "${NBD}p1")"

          mount "${NBD}p2" "$DSTMNT"
          mkdir -p "$DSTMNT/boot/efi"
          mount "${NBD}p1" "$DSTMNT/boot/efi"

          # Copy the whole guest tree (root + subvols + ESP), preserving SELinux,
          # ACLs, xattrs and hardlinks.
          guestmount --ro -a "$SRC" -i "$SRCMNT"
          rsync -aHAXx --numeric-ids "$SRCMNT"/ "$DSTMNT"/
          guestunmount "$SRCMNT"

          # fstab: drop every line for the old root UUID (all btrfs subvols) and the
          # ESP, then add clean ext4 root + ESP entries (root UUID is unchanged).
          FSTAB="$DSTMNT/etc/fstab"
          sed -i "\#UUID=${OLDUUID}#d; \#/boot/efi#d" "$FSTAB"
          {
            echo "UUID=$OLDUUID  /          ext4  defaults                        0 1"
            echo "UUID=$ESPUUID  /boot/efi  vfat  umask=0077,shortname=winnt      0 2"
          } >> "$FSTAB"

          # Bootloader + initramfs + relabel, in the target's own context.
          for d in dev dev/pts proc sys run; do mount --bind "/$d" "$DSTMNT/$d"; done
          chroot "$DSTMNT" /bin/bash -euo pipefail -c '
            KVER=$(rpm -q kernel --qf "%{version}-%{release}.%{arch}\n" | sort -V | tail -1)
            grub2-install --target=x86_64-efi --efi-directory=/boot/efi \
              --bootloader-id=fedora --removable
            grub2-mkconfig -o /boot/grub2/grub.cfg
            dracut --force --kver "$KVER"
            touch /.autorelabel
          '
          echo "CONVERSION OK: root=ext4 uuid=$OLDUUID esp=$ESPUUID size=$SIZE"

    # ----- 2. Run the conversion -----
    - name: Convert btrfs -> ext4 (partition, copy, chroot-fix)
      become: true
      ansible.builtin.command:
        argv:
          - "{{ convert_script }}"
          - "{{ source_image }}"
          - "{{ ext4_image }}"
          - "{{ target_size }}"
      register: convert
      changed_when: true

    - name: Show conversion output
      ansible.builtin.debug:
        var: convert.stdout_lines

    # ----- 3. Sparsify + convert to VMDK -----
    - name: Sparsify the ext4 image
      become: true
      environment:
        LIBGUESTFS_BACKEND: direct
      ansible.builtin.command:
        argv: [virt-sparsify, --in-place, "{{ ext4_image }}"]
      changed_when: true

    - name: Convert to VMDK ({{ vmdk_subformat }})
      become: true
      ansible.builtin.command:
        argv:
          - qemu-img
          - convert
          - -f
          - qcow2
          - -O
          - vmdk
          - -o
          - "subformat={{ vmdk_subformat }}"
          - "{{ ext4_image }}"
          - "{{ output_vmdk }}"
      changed_when: true

    # ----- 4. Report -----
    - name: Read back the ext4 qcow virtual size
      become: true
      ansible.builtin.command:
        argv: [qemu-img, info, "{{ ext4_image }}"]
      register: ext4_info
      changed_when: false

    - name: Show the VMDK file size
      ansible.builtin.command:
        argv: [ls, -lh, "{{ output_vmdk }}"]
      register: vmdk_size
      changed_when: false

    - name: Done
      ansible.builtin.debug:
        msg: >-
          ext4 image ready. qcow info: {{ ext4_info.stdout_lines }} |
          VMDK: {{ vmdk_size.stdout }}. BEFORE stage: boot it and migrate one clone
          with skip-guest-conversion to confirm it boots clean (different FS).
