---
# Configures the Node.js frontend VM for the Wandering Workload app. Runs everything as root.
# Run this ON the frontend VM itself:
#   sudo ansible-playbook frontend.yml
#
# The app finds the DB by hostname (backend_svc_name, default 'wandering-backend-svc').
# On VMware the wandering-env-detect boot service maps the name to backend_ip via
# /etc/hosts. On OpenShift a K8s Service of the same name is resolved by CoreDNS.
# Nothing to change at migration — just power off and MTV.
#
- name: Configure the Node.js frontend VM
  hosts: localhost
  connection: local
  become: true

  vars:
    # Where the app source (server.js, package.json, public/) lives, relative to this
    # playbook. Defaults to the repo root one level up. Override with -e app_src=/path
    # if you ever relocate the playbook away from the source.
    app_src: "{{ playbook_dir }}/.."
    app_dir: /opt/wandering-workload
    # The app binds this port. Runs as root, so privileged ports (80) are fine.
    # Override with -e app_port=8080 if you need an unprivileged port.
    app_port: 80

    # --- Static IP for THIS host's NIC (NetworkManager). EDIT per host. ---
    # Applied by default; runs `nmcli con up`, which reactivates the connection and
    # WILL drop an SSH session - run from the console. Skip it on an app-only
    # redeploy with `--skip-tags network`, or set just the IP with `--tags network`.
    net_interface: ens192
    net_static_ip: "198.51.100.202/24"     # the frontend host (RFC 5737 — change for your network)
    net_gateway: "198.51.100.1"
    net_dns: "198.51.100.1,8.8.8.8"

    # This host's persistent hostname. The frontend-only role is ww_fe.
    target_hostname: ww_fe

    db_name: todo
    db_user: todo
    db_password: todo

    # Troubleshooting / override knobs
    run_health_check: true                 # curl /health at the end of a normal run
    health_check_retries: 15               # how long to wait for the app to come up

  tasks:
    # --- Pin this host's static IP first, so the box keeps its address for the
    # rest of the run. nmcli is idempotent here: the activate step only fires when
    # the address actually changes, so redeploys don't bounce the network.
    - name: Find the NetworkManager connection for the NIC
      ansible.builtin.command: nmcli -g GENERAL.CONNECTION device show {{ net_interface }}
      register: nm_con
      changed_when: false
      tags: [network]

    - name: Read the NIC's current IPv4 address
      ansible.builtin.command: nmcli -g ipv4.addresses connection show "{{ nm_con.stdout }}"
      register: nm_cur_addr
      changed_when: false
      tags: [network]

    - name: Pin the static IPv4 configuration
      ansible.builtin.command: >-
        nmcli connection modify "{{ nm_con.stdout }}"
        ipv4.method manual
        ipv4.addresses {{ net_static_ip }}
        ipv4.gateway {{ net_gateway }}
        ipv4.dns "{{ net_dns }}"
        ipv6.method ignore
      when: nm_cur_addr.stdout != net_static_ip
      register: nm_mod
      tags: [network]

    - name: Activate the static IPv4 configuration (briefly drops connectivity - console only)
      ansible.builtin.command: nmcli connection up "{{ nm_con.stdout }}"
      when: nm_mod is changed
      tags: [network]

    - name: Set the persistent hostname
      ansible.builtin.hostname:
        name: "{{ target_hostname }}"
      when: ansible_facts['nodename'] != target_hostname
      tags: [network, hostname]

    # --- Environment detection: VMware vs OpenShift --------------------------
    # At every boot, wandering-env-detect.service uses systemd-detect-virt to
    # decide whether to write /etc/hosts entries (VMware) or remove them
    # (OpenShift, where CoreDNS resolves the K8s Service names instead).
    # This is what makes the migration zero-touch.
    - name: Install the environment detection script
      ansible.builtin.copy:
        dest: /usr/local/bin/wandering-env-detect.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # Manages /etc/hosts entries for service-name resolution.
          # VMware:    writes entries so service names resolve to static VMware IPs.
          # OpenShift: removes them — CoreDNS resolves the K8s Service names instead.
          MARKER_START="# BEGIN WANDERING-WORKLOAD SERVICE EMULATION"
          MARKER_END="# END WANDERING-WORKLOAD SERVICE EMULATION"
          VIRT=$(systemd-detect-virt 2>/dev/null || echo "unknown")

          # Always remove the managed block first (clean slate)
          sed -i "/${MARKER_START}/,/${MARKER_END}/d" /etc/hosts

          if [ "$VIRT" = "vmware" ]; then
              cat >> /etc/hosts <<EOF
          ${MARKER_START}
          {{ backend_ip }}  {{ backend_svc_name }}
          ${MARKER_END}
          EOF
              echo "wandering-env-detect: VMware detected — /etc/hosts service entries written"
          else
              echo "wandering-env-detect: ${VIRT} detected — relying on platform DNS"
          fi
      notify:
        - Reload systemd
        - Run environment detection

    - name: Install the environment detection systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/wandering-env-detect.service
        mode: "0644"
        content: |
          [Unit]
          Description=Wandering Workload environment detection (VMware vs OpenShift)
          Before=wandering-workload.service
          After=local-fs.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/wandering-env-detect.sh
          RemainAfterExit=true

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Run environment detection

    - name: Enable the environment detection service at boot
      ansible.builtin.systemd:
        name: wandering-env-detect
        enabled: true
        daemon_reload: true

    # Ensure env-detect has run before the app starts (first deploy)
    - name: Run environment detection now
      ansible.builtin.systemd:
        name: wandering-env-detect
        state: started
        daemon_reload: true

    - name: Install Node.js
      ansible.builtin.dnf:
        name:
          - nodejs
          - npm
        state: present

    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy application source
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ app_dir }}/"
        mode: preserve
      loop:
        - "{{ app_src }}/server.js"
        - "{{ app_src }}/package.json"
      notify: Restart wandering-workload

    - name: Copy static assets
      ansible.builtin.copy:
        src: "{{ app_src }}/public/"
        dest: "{{ app_dir }}/public/"
      notify: Restart wandering-workload

    - name: Install Node dependencies (express, pg)
      ansible.builtin.command:
        cmd: npm install --omit=dev
        chdir: "{{ app_dir }}"
      register: npm_install
      changed_when: "'added' in npm_install.stdout or 'changed' in npm_install.stdout"
      notify: Restart wandering-workload

    - name: Install the environment file
      ansible.builtin.copy:
        dest: /etc/wandering-workload.env
        owner: root
        group: root
        mode: "0600"
        content: |
          DB_HOST={{ backend_svc_name }}
          DB_PORT=5432
          DB_USER={{ db_user }}
          DB_PASSWORD={{ db_password }}
          DB_NAME={{ db_name }}
          PORT={{ app_port }}
      notify: Restart wandering-workload

    - name: Install the systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/wandering-workload.service
        mode: "0644"
        content: |
          [Unit]
          Description=Wandering Workload (Node.js frontend)
          After=network-online.target wandering-env-detect.service
          Wants=network-online.target
          Requires=wandering-env-detect.service

          [Service]
          Type=simple
          WorkingDirectory={{ app_dir }}
          EnvironmentFile=/etc/wandering-workload.env
          ExecStart=/usr/bin/node {{ app_dir }}/server.js
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart wandering-workload

    - name: Enable and start the app at boot
      ansible.builtin.systemd:
        name: wandering-workload
        enabled: true
        daemon_reload: true
        state: started

    # --- Host firewall: disabled by design. These demo VMs sit on a trusted vnet
    # and get migrated/failed-over repeatedly; the host firewall only adds friction
    # (a silently-dropped app port looks identical to a dead app on stage). Stop +
    # disable + mask so nothing (a package, a reboot) can bring it back. Guarded so
    # it's a no-op when firewalld isn't installed.
    - name: Check whether firewalld is present
      ansible.builtin.command: systemctl list-unit-files firewalld.service
      register: fw_unit
      changed_when: false
      failed_when: false

    - name: Disable and mask the host firewall
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: false
        masked: true
      when: "'firewalld.service' in fw_unit.stdout"

    # --- Reclaim disk space: drop the dnf + npm caches left by the installs
    # above. They add a few hundred MB the running app never needs, and on the
    # shrunk ~1.7 GB disk that headroom matters before an MTV migration.
    - name: Reclaim the dnf cache
      ansible.builtin.command: dnf clean all
      changed_when: false
      tags: [reclaim]

    - name: Reclaim the npm cache
      ansible.builtin.command: npm cache clean --force
      changed_when: false
      tags: [reclaim]

    - name: Apply restarts before the health check
      ansible.builtin.meta: flush_handlers

    - name: Health check the app
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        return_content: true
      register: health
      retries: "{{ health_check_retries }}"
      delay: 2
      until: health.status == 200
      when: run_health_check | bool
      failed_when: false

    - name: Report health
      ansible.builtin.debug:
        msg: >-
          {{ 'App healthy: ' ~ health.content if (health.status | default(0)) == 200
             else 'App did NOT report healthy. See: journalctl -u wandering-workload -e' }}
      when: run_health_check | bool

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart wandering-workload
      ansible.builtin.systemd:
        name: wandering-workload
        state: restarted

    - name: Run environment detection
      ansible.builtin.systemd:
        name: wandering-env-detect
        state: restarted
