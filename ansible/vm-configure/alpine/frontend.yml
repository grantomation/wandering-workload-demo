---
# Configures the Node.js frontend VM for the Wandering Workload app on Alpine.
# Run this ON the frontend VM itself:
#   ansible-playbook ansible/vm-configure/alpine/frontend.yml
- name: Configure the Node.js frontend VM (Alpine)
  hosts: localhost
  connection: local

  vars_files:
    - ../group_vars/all.yml

  vars:
    app_src: "{{ playbook_dir }}/../.."
    app_dir: /opt/wandering-workload
    app_port: 80

    net_interface: eth0
    net_static_ip: "198.51.100.202"
    net_netmask: "255.255.255.0"
    net_gateway: "198.51.100.1"
    net_dns: "198.51.100.1 8.8.8.8"

    target_hostname: ww_fe

    db_name: todo
    db_user: todo
    db_password: todo

    run_health_check: true
    health_check_retries: 15

  tasks:
    - name: Upgrade all packages (prevent partial upgrade library errors)
      ansible.builtin.command: apk upgrade --no-cache
      changed_when: false

    - name: Install virt-what (for systemd-detect-virt equivalent)
      ansible.builtin.command: apk add --no-cache virt-what
      changed_when: false

    - name: Install the environment detection script
      ansible.builtin.copy:
        dest: /usr/local/bin/wandering-env-detect.sh
        mode: "0755"
        content: |
          #!/bin/sh
          MARKER_START="# BEGIN WANDERING-WORKLOAD SERVICE EMULATION"
          MARKER_END="# END WANDERING-WORKLOAD SERVICE EMULATION"
          VIRT=$(virt-what 2>/dev/null || echo "unknown")

          sed -i "/${MARKER_START}/,/${MARKER_END}/d" /etc/hosts

          cat > /etc/network/interfaces <<'EOF'
          auto lo
          iface lo inet loopback

          auto {{ net_interface }}
          EOF

          if echo "$VIRT" | grep -q "vmware"; then
              cat >> /etc/hosts <<EOF
          ${MARKER_START}
          {{ backend_ip }}  {{ backend_svc_name }}
          ${MARKER_END}
          EOF
              cat >> /etc/network/interfaces <<'EOF'
          iface {{ net_interface }} inet static
            address {{ net_static_ip }}
            netmask {{ net_netmask }}
            gateway {{ net_gateway }}
          EOF
              cat > /etc/resolv.conf <<'EOF'
          nameserver {{ net_dns.split()[0] }}
          nameserver 8.8.8.8
          EOF
              echo "wandering-env-detect: VMware detected, static network & DNS applied."
          else
              cat >> /etc/network/interfaces <<'EOF'
          iface {{ net_interface }} inet dhcp
          EOF
              echo "wandering-env-detect: ${VIRT} detected, DHCP network applied."
          fi
      notify: Run environment detection

    - name: Install the environment detection OpenRC service
      ansible.builtin.copy:
        dest: /etc/init.d/wandering-env-detect
        mode: "0755"
        content: |
          #!/sbin/openrc-run
          description="Wandering Workload environment detection"

          depend() {
              before networking
              before wandering-workload
          }

          start() {
              ebegin "Running wandering-env-detect"
              /usr/local/bin/wandering-env-detect.sh
              eend $?
          }
      notify: Run environment detection

    - name: Enable the environment detection service at boot
      ansible.builtin.service:
        name: wandering-env-detect
        enabled: true

    - name: Run environment detection now
      ansible.builtin.service:
        name: wandering-env-detect
        state: started

    - name: Install Node.js
      ansible.builtin.command: apk add --no-cache nodejs npm curl
      changed_when: false

    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy application source
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ app_dir }}/"
        mode: preserve
      loop:
        - "{{ app_src }}/server.js"
        - "{{ app_src }}/package.json"
      notify: Restart wandering-workload

    - name: Copy static assets
      ansible.builtin.copy:
        src: "{{ app_src }}/public/"
        dest: "{{ app_dir }}/public/"
      notify: Restart wandering-workload

    - name: Install Node dependencies
      ansible.builtin.command:
        cmd: npm install --omit=dev
        chdir: "{{ app_dir }}"
      register: npm_install
      changed_when: "'added' in npm_install.stdout or 'changed' in npm_install.stdout"
      notify: Restart wandering-workload

    - name: Install the environment file
      ansible.builtin.copy:
        dest: /etc/wandering-workload.env
        mode: "0600"
        content: |
          DB_HOST={{ backend_svc_name }}
          DB_PORT=5432
          DB_USER={{ db_user }}
          DB_PASSWORD={{ db_password }}
          DB_NAME={{ db_name }}
          PORT={{ app_port }}
      notify: Restart wandering-workload

    - name: Install the OpenRC service for the app
      ansible.builtin.copy:
        dest: /etc/init.d/wandering-workload
        mode: "0755"
        content: |
          #!/sbin/openrc-run
          description="Wandering Workload (Node.js frontend)"

          depend() {
              need net
              after wandering-env-detect
          }

          supervisor=supervise-daemon
          command="/usr/bin/node"
          command_args="{{ app_dir }}/server.js"
          directory="{{ app_dir }}"
          output_log="/var/log/wandering-workload.log"
          error_log="/var/log/wandering-workload.log"
          respawn_delay=5
          respawn_max=0

          start_pre() {
              . /etc/wandering-workload.env
              export DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME PORT
          }
      notify: Restart wandering-workload

    - name: Enable and start the app at boot
      ansible.builtin.service:
        name: wandering-workload
        enabled: true
        state: started

    - name: Apply restarts before the health check
      ansible.builtin.meta: flush_handlers

    - name: Health check the app
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        return_content: true
      register: health
      retries: "{{ health_check_retries }}"
      delay: 2
      until: health.status == 200
      when: run_health_check | bool
      failed_when: false

    - name: Report health
      ansible.builtin.debug:
        msg: >-
          {{ 'App healthy: ' ~ health.content if (health.status | default(0)) == 200
             else 'App did NOT report healthy. See: cat /var/log/wandering-workload.log' }}
      when: run_health_check | bool

    - name: Reclaim the npm cache
      ansible.builtin.command: npm cache clean --force
      changed_when: false
      tags: [reclaim]

    - name: Set the persistent hostname
      ansible.builtin.hostname:
        name: "{{ target_hostname }}"
      tags: [network, hostname]

    - name: Reboot the VM to apply networking and verify boot services
      ansible.builtin.shell: sleep 2 && reboot
      async: 10
      poll: 0
      changed_when: true

  handlers:
    - name: Restart wandering-workload
      ansible.builtin.service:
        name: wandering-workload
        state: restarted

    - name: Run environment detection
      ansible.builtin.service:
        name: wandering-env-detect
        state: restarted
