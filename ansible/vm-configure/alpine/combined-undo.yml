---
# Reverses everything combined_alpine.yml deployed on a single server.
# Run this ON the server itself:
#   ansible-playbook combined-undo_alpine.yml
- name: Tear down the full Wandering Workload stack (Alpine)
  hosts: localhost
  connection: local

  vars:
    app_dir: /opt/wandering-workload
    pg_data_dir: /var/lib/postgresql/17/data

  tasks:
    - name: Stop and disable the app service
      ansible.builtin.service:
        name: wandering-workload
        state: stopped
        enabled: false
      failed_when: false

    - name: Stop and disable PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the OpenRC init scripts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/init.d/wandering-workload

    - name: Remove the environment config file
      ansible.builtin.file:
        path: /etc/wandering-workload.env
        state: absent

    - name: Remove the application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: absent

    - name: Wipe the PostgreSQL data directory
      ansible.builtin.file:
        path: "{{ pg_data_dir }}"
        state: absent
