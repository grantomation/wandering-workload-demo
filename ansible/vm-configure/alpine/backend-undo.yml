---
# Reverses everything backend_alpine.yml deployed.
# Run this ON the database VM itself:
#   ansible-playbook backend-undo_alpine.yml
- name: Tear down the PostgreSQL backend VM (Alpine)
  hosts: localhost
  connection: local

  vars:
    pg_data_dir: /var/lib/postgresql/17/data

  tasks:
    - name: Stop and disable PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: stopped
        enabled: false
      failed_when: false

    - name: Stop and disable environment detection
      ansible.builtin.service:
        name: wandering-env-detect
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the OpenRC init script for env detection
      ansible.builtin.file:
        path: /etc/init.d/wandering-env-detect
        state: absent

    - name: Remove the environment detection script
      ansible.builtin.file:
        path: /usr/local/bin/wandering-env-detect.sh
        state: absent

    - name: Wipe the PostgreSQL data directory
      ansible.builtin.file:
        path: "{{ pg_data_dir }}"
        state: absent
