---
# Reverses everything frontend.yml configured on the Node.js frontend VM.
# Run this ON the frontend VM itself:
#   sudo ansible-playbook frontend-undo.yml
#
# It removes the app, its systemd unit, env file, firewall opening, and the
# wandering-env-detect service (VMware/OpenShift environment detection). It
# does NOT uninstall nodejs/npm/firewalld - those packages are left in place
# (remove them by hand if nothing else needs them). The static NIC IP is left as-is.
#
# If you opened a non-default port on the way in, pass the same value back:
#   sudo ansible-playbook frontend-undo.yml -e app_port=8080
- name: Tear down the Node.js frontend VM
  hosts: localhost
  connection: local
  become: true

  vars:
    app_dir: /opt/wandering-workload
    # Must match whatever frontend.yml opened in the firewall (default 80).
    app_port: 80

  tasks:
    - name: Stop and disable the app service
      ansible.builtin.systemd:
        name: wandering-workload
        state: stopped
        enabled: false
      failed_when: false

    - name: Stop and disable the environment detection service
      ansible.builtin.systemd:
        name: wandering-env-detect
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the systemd unit files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/wandering-workload.service
        - /etc/systemd/system/wandering-env-detect.service
      notify: Reload systemd

    - name: Remove the environment config file
      ansible.builtin.file:
        path: /etc/wandering-workload.env
        state: absent

    - name: Remove the env-detect script
      ansible.builtin.file:
        path: /usr/local/bin/wandering-env-detect.sh
        state: absent

    - name: Remove managed /etc/hosts entries
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: 'WANDERING-WORKLOAD SERVICE EMULATION'
        state: absent

    - name: Remove the application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: absent

    - name: Close the app port (ignored if firewalld is gone or it was never open)
      ansible.builtin.command: firewall-cmd --permanent --remove-port={{ app_port }}/tcp
      register: fw
      changed_when: "'ALREADY_DISABLED' not in fw.stderr"
      failed_when: false

    - name: Reload firewalld
      ansible.builtin.command: firewall-cmd --reload
      when: fw.changed | default(false)
      failed_when: false

    - name: Apply the systemd unit removals
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
