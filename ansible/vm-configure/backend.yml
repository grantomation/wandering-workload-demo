---
# Configures the PostgreSQL backend VM for the Wandering Workload app.
# Run this ON the database VM itself:
#   sudo ansible-playbook backend.yml
#
# Postgres is reached by hostname (backend_svc_name → 'wandering-backend-svc').
# On VMware the frontend resolves this via /etc/hosts; on OpenShift via CoreDNS +
# K8s Service. Nothing here needs tearing down before an OpenShift/MTV migration.
- name: Configure the PostgreSQL backend VM
  hosts: localhost
  connection: local
  become: true

  vars:
    # --- Static IP for THIS host's NIC (NetworkManager). EDIT per host. ---
    # Applied by default; runs `nmcli con up`, which reactivates the connection and
    # WILL drop an SSH session - run from the console. Skip with `--skip-tags network`.
    net_interface: ens192
    # The backend's own IP = the shared backend_ip (group_vars/all.yml). Change it
    # there (or -e backend_ip=...) and both this NIC and the env-detect hosts entry follow.
    net_static_ip: "{{ backend_ip }}/24"   # the backend/DB host
    net_gateway: "198.51.100.1"
    net_dns: "198.51.100.1,8.8.8.8"

    # This host's persistent hostname. The backend-only role is ww_be.
    target_hostname: ww_be

    pg_data_dir: /var/lib/pgsql/data
    db_name: todo
    db_user: todo
    db_password: todo
    # CIDR allowed to connect to Postgres. Open to all — this is a demo workload
    # with password auth, and after migration the frontend arrives from a pod-network
    # IP (e.g. 10.128.x.x) that varies per cluster. A restrictive CIDR would break
    # at cutover. Postgres is still gated by pg_hba + password (scram-sha-256).
    app_cidr: "0.0.0.0/0"

  tasks:
    # --- Pin this host's static IP first, so the box keeps its address for the
    # rest of the run. The activate step only fires when the address changes.
    - name: Find the NetworkManager connection for the NIC
      ansible.builtin.command: nmcli -g GENERAL.CONNECTION device show {{ net_interface }}
      register: nm_con
      changed_when: false
      tags: [network]

    - name: Read the NIC's current IPv4 address
      ansible.builtin.command: nmcli -g ipv4.addresses connection show "{{ nm_con.stdout }}"
      register: nm_cur_addr
      changed_when: false
      tags: [network]

    - name: Pin the static IPv4 configuration
      ansible.builtin.command: >-
        nmcli connection modify "{{ nm_con.stdout }}"
        ipv4.method manual
        ipv4.addresses {{ net_static_ip }}
        ipv4.gateway {{ net_gateway }}
        ipv4.dns "{{ net_dns }}"
        ipv6.method ignore
      when: nm_cur_addr.stdout != net_static_ip
      register: nm_mod
      tags: [network]

    - name: Activate the static IPv4 configuration (briefly drops connectivity - console only)
      ansible.builtin.command: nmcli connection up "{{ nm_con.stdout }}"
      when: nm_mod is changed
      tags: [network]

    - name: Set the persistent hostname
      ansible.builtin.hostname:
        name: "{{ target_hostname }}"
      when: ansible_facts['nodename'] != target_hostname
      tags: [network, hostname]

    # --- Environment detection: VMware vs OpenShift --------------------------
    # Same script as the frontend. On the backend it isn't strictly needed for
    # connectivity (Postgres listens on *, it doesn't initiate connections), but
    # having it on both VMs means the golden image + both role playbooks are
    # consistent, and future use cases (backend calling the frontend) are covered.
    - name: Install the environment detection script
      ansible.builtin.copy:
        dest: /usr/local/bin/wandering-env-detect.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # Manages /etc/hosts entries for service-name resolution.
          # VMware:    writes entries so service names resolve to static VMware IPs.
          # OpenShift: removes them — CoreDNS resolves the K8s Service names instead.
          MARKER_START="# BEGIN WANDERING-WORKLOAD SERVICE EMULATION"
          MARKER_END="# END WANDERING-WORKLOAD SERVICE EMULATION"
          VIRT=$(systemd-detect-virt 2>/dev/null || echo "unknown")

          # Always remove the managed block first (clean slate)
          sed -i "/${MARKER_START}/,/${MARKER_END}/d" /etc/hosts

          if [ "$VIRT" = "vmware" ]; then
              cat >> /etc/hosts <<EOF
          ${MARKER_START}
          {{ backend_ip }}  {{ backend_svc_name }}
          ${MARKER_END}
          EOF
              echo "wandering-env-detect: VMware detected — /etc/hosts service entries written"
          else
              echo "wandering-env-detect: ${VIRT} detected — relying on platform DNS"
          fi
      notify:
        - Reload systemd
        - Run environment detection

    - name: Install the environment detection systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/wandering-env-detect.service
        mode: "0644"
        content: |
          [Unit]
          Description=Wandering Workload environment detection (VMware vs OpenShift)
          Before=postgresql.service
          After=local-fs.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/wandering-env-detect.sh
          RemainAfterExit=true

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Run environment detection

    - name: Enable the environment detection service at boot
      ansible.builtin.systemd:
        name: wandering-env-detect
        enabled: true
        daemon_reload: true

    # Ensure env-detect has run before Postgres starts (first deploy)
    - name: Run environment detection now
      ansible.builtin.systemd:
        name: wandering-env-detect
        state: started
        daemon_reload: true

    - name: Install PostgreSQL
      ansible.builtin.dnf:
        name:
          - postgresql-server
          - postgresql
        state: present

    - name: Check whether the database cluster is initialised
      ansible.builtin.stat:
        path: "{{ pg_data_dir }}/PG_VERSION"
      register: pg_initialised

    - name: Initialise the database cluster
      ansible.builtin.command: /usr/bin/postgresql-setup --initdb
      when: not pg_initialised.stat.exists

    - name: Listen on all interfaces
      ansible.builtin.lineinfile:
        path: "{{ pg_data_dir }}/postgresql.conf"
        regexp: '^#?\s*listen_addresses\s*='
        line: "listen_addresses = '*'"
      notify: Restart postgresql

    - name: Allow the app to connect over the network (password auth)
      ansible.builtin.blockinfile:
        path: "{{ pg_data_dir }}/pg_hba.conf"
        marker: "# {mark} ANSIBLE MANAGED TODO-APP ACCESS"
        block: |
          host  {{ db_name }}  {{ db_user }}  {{ app_cidr }}  scram-sha-256
      notify: Restart postgresql

    - name: Enable and start PostgreSQL at boot
      ansible.builtin.systemd:
        name: postgresql
        enabled: true
        state: started

    - name: Apply any pending config changes before loading data
      ansible.builtin.meta: flush_handlers

    - name: Create the application role
      become_user: postgres
      ansible.builtin.command:
        cmd: >-
          psql -d postgres -v ON_ERROR_STOP=1 -c
          "DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='{{ db_user }}')
          THEN CREATE ROLE {{ db_user }} LOGIN PASSWORD '{{ db_password }}'; END IF; END $$;"
      changed_when: true

    - name: Create the application database
      become_user: postgres
      ansible.builtin.shell:
        cmd: >-
          psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='{{ db_name }}'" | grep -q 1
          || psql -d postgres -c "CREATE DATABASE {{ db_name }} OWNER {{ db_user }}"
      register: createdb
      changed_when: "'CREATE DATABASE' in createdb.stdout"

    - name: Create the stops table (the app expects this; IF NOT EXISTS preserves data across re-runs)
      become_user: postgres
      ansible.builtin.command:
        cmd: >-
          psql -d {{ db_name }} -v ON_ERROR_STOP=1 -c
          "CREATE TABLE IF NOT EXISTS stops (
             id SERIAL PRIMARY KEY,
             name TEXT NOT NULL,
             x REAL NOT NULL,
             y REAL NOT NULL,
             color TEXT NOT NULL,
             created_at TIMESTAMPTZ NOT NULL DEFAULT now());
           ALTER TABLE stops ADD COLUMN IF NOT EXISTS url TEXT;
           ALTER TABLE stops OWNER TO {{ db_user }};"
      changed_when: true

    # --- Host firewall: disabled by design. These demo VMs sit on a trusted vnet
    # and get migrated/failed-over repeatedly; the host firewall only adds friction
    # (a silently-dropped 5432 looks identical to a dead DB on stage). Postgres is
    # still gated by pg_hba (app_cidr) + password auth. Stop + disable + mask so
    # nothing (a package, a reboot) can bring it back. Guarded so it's a no-op when
    # firewalld isn't installed.
    - name: Check whether firewalld is present
      ansible.builtin.command: systemctl list-unit-files firewalld.service
      register: fw_unit
      changed_when: false
      failed_when: false

    - name: Disable and mask the host firewall
      ansible.builtin.systemd:
        name: firewalld
        state: stopped
        enabled: false
        masked: true
      when: "'firewalld.service' in fw_unit.stdout"

    # --- Reclaim disk space: drop the dnf cache left by the Postgres install.
    # Frees a few hundred MB the running DB never needs, which matters on the
    # shrunk ~1.7 GB disk before an MTV migration. (No npm here - DB only.)
    - name: Reclaim the dnf cache
      ansible.builtin.command: dnf clean all
      changed_when: false
      tags: [reclaim]

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart postgresql
      ansible.builtin.systemd:
        name: postgresql
        state: restarted

    - name: Run environment detection
      ansible.builtin.systemd:
        name: wandering-env-detect
        state: restarted
