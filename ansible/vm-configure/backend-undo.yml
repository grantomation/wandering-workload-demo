---
# Reverses everything backend.yml configured on the PostgreSQL backend VM.
# Run this ON the database VM itself:
#   sudo ansible-playbook backend-undo.yml
#
# FULL WIPE: this stops PostgreSQL and DELETES the entire cluster data directory
# ({{ pg_data_dir }}) - every database, role, and row is destroyed. The app
# database/role are gone with it. It also removes the firewall opening and the
# wandering-env-detect service. It does NOT uninstall postgresql-server/firewalld,
# and leaves the static NIC IP as-is.
- name: Tear down the PostgreSQL backend VM
  hosts: localhost
  connection: local
  become: true

  vars:
    pg_data_dir: /var/lib/pgsql/data

  tasks:
    - name: Stop and disable PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        state: stopped
        enabled: false
      failed_when: false

    - name: Stop and disable the environment detection service
      ansible.builtin.systemd:
        name: wandering-env-detect
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the env-detect systemd unit and script
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/wandering-env-detect.service
        - /usr/local/bin/wandering-env-detect.sh
      notify: Reload systemd

    - name: Remove managed /etc/hosts entries
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: 'WANDERING-WORKLOAD SERVICE EMULATION'
        state: absent

    - name: Wipe the PostgreSQL data directory (destroys all databases and roles)
      ansible.builtin.file:
        path: "{{ pg_data_dir }}"
        state: absent

    - name: Close the PostgreSQL port (ignored if firewalld is gone or it was never open)
      ansible.builtin.command: firewall-cmd --permanent --remove-port=5432/tcp
      register: fw
      changed_when: "'ALREADY_DISABLED' not in fw.stderr"
      failed_when: false

    - name: Reload firewalld
      ansible.builtin.command: firewall-cmd --reload
      when: fw.changed | default(false)
      failed_when: false

    - name: Apply the systemd unit removals
      ansible.builtin.meta: flush_handlers

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
