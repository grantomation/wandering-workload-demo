---
# Shared variables for the Wandering Workload playbooks.
# Auto-loaded for `hosts: localhost` when you run a playbook from this directory,
# so both frontend.yml and backend.yml see these without any vars_files wiring.

# The hostname the frontend uses to find the backend's Postgres. Resolved by:
#   VMware:    /etc/hosts (managed at boot by wandering-env-detect.service)
#   OpenShift: K8s Service + CoreDNS (the Service is called the same name)
# This replaces the old db_candidates IP list - no more IP-scanning.
backend_svc_name: "wandering-backend-svc"

# Where the backend sits ON VMWARE (its pinned NIC IP). Used by:
#   1. backend.yml to pin the NIC via NetworkManager
#   2. wandering-env-detect.service to write /etc/hosts on VMware
# On OpenShift the NIC name changes (ens192 → eth0/virtio), so this static
# config is ignored and the pod network assigns an IP via DHCP.
#
# *** CHANGE THIS for your environment ***
# The defaults below use RFC 5737 TEST-NET-2 addresses (198.51.100.0/24).
# These are IANA-reserved documentation/example addresses that will never route
# on a real network. Replace them with your actual VMware network IPs:
#   -e backend_ip=10.0.1.41
# The same applies to net_gateway/net_dns in the per-role playbooks.
backend_ip: "198.51.100.41"
