apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: 6-build-vddk-image
  annotations:
    description: >-
      Builds the VDDK container image from the VMware VDDK tarball on
      the artifact server and pushes it to the internal registry.
      Grants pull access so any namespace (including openshift-mtv) can use it.
    dependencies: "pipeline 5 (artifact server must be deployed with VDDK tarball uploaded)"
spec:
  description: >-
    VDDK image pipeline:
    1. Build the VDDK container image from the tarball on the artifacts PVC
    2. Push to the internal registry
    3. Grant image pull access to all authenticated users
  params:
    - name: namespace
      type: string
      description: Build namespace
      default: "workload-portability-build"

  tasks:
    - name: build-vddk-image
      taskRef:
        name: build-vddk-image
      params:
        - name: namespace
          value: $(params.namespace)
