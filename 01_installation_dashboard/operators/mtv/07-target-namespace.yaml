apiVersion: v1
kind: Namespace
metadata:
  name: wandering-workload
---
apiVersion: v1
kind: Service
metadata:
  name: wandering-backend-svc
  namespace: wandering-workload
spec:
  selector:
    app: wandering-backend
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: wandering-frontend-svc
  namespace: wandering-workload
spec:
  selector:
    app: wandering-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: wandering-workload-vm
  namespace: wandering-workload
spec:
  to:
    kind: Service
    name: wandering-frontend-svc
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
